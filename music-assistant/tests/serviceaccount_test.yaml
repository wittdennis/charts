suite: music-assistant.serviceaccount value dependencies
templates:
  - templates/serviceaccount.yaml
tests:
  # The server never talks to the Kubernetes API
  - it: creates an account without a mounted token by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-music-assistant
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses the given name
    set:
      serviceAccount.name: music
    asserts:
      - equal:
          path: metadata.name
          value: music

  - it: renders nothing when the chart creates no account
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
