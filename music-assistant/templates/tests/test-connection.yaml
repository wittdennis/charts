apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "music-assistant.fullname" . }}-test-connection"
  labels:
    {{- include "music-assistant.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: docker.io/library/busybox:1.38.0 # renovate: datasource=docker depName=docker.io/library/busybox versioning=docker
      command: ['wget']
      args: ['{{ include "music-assistant.fullname" . }}:{{ .Values.service.port }}/info']
  restartPolicy: Never
