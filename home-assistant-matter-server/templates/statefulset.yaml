apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "home-assistant-matter-server.fullname" . }}
  labels:
    {{- include "home-assistant-matter-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "home-assistant-matter-server.fullname" . }}
  selector:
    matchLabels:
      {{- include "home-assistant-matter-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "home-assistant-matter-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostname: {{ include "home-assistant-matter-server.fullname" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "home-assistant-matter-server.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.lockFileRemover.enabled }}
      initContainers:
        - name: lock-remover
          image: {{ .Values.lockFileRemover.image.registry }}/{{ .Values.lockFileRemover.image.repository }}:{{ .Values.lockFileRemover.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: false
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh

              rm -f /data/*/matter.lock
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: true
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --storage-path
            - /data
            - --port
            - {{ .Values.port | quote }}
            {{- range .Values.listenAddresses }}
            - --listen-address
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            {{- $productionMode := .Values.dashboard.productionMode }}
            {{- if kindIs "invalid" $productionMode }}
            {{- $productionMode = or .Values.ingress.enabled .Values.route.enabled }}
            {{- end }}
            {{- if $productionMode }}
            - --production-mode
            {{- end }}
            {{- else }}
            - --disable-dashboard
            {{- end }}
            {{- if .Values.timeSync.enabled }}
            - --enable-time-sync
            {{- end }}
            {{- if .Values.log.logLevel }}
            - --log-level
            - {{ .Values.log.logLevel }}
            {{- end }}
            {{- if .Values.bluetoothCommissioning.enabled }}
            {{- if eq .Values.bluetoothCommissioning.mode "adapter" }}
            - --bluetooth-adapter
            - {{ .Values.bluetoothCommissioning.adapterId | quote }}
            {{- else if eq .Values.bluetoothCommissioning.mode "proxy" }}
            - --ble-proxy
            {{- else }}
            {{- fail "bluetoothCommissioning.mode must be one of: adapter, proxy" }}
            {{- end }}
            {{- end }}
            {{- if .Values.networkInterface }}
            - --primary-interface
            - {{ .Values.networkInterface }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.log.format .Values.extraEnv }}
          env:
            {{- if .Values.log.format }}
            - name: MATTER_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          {{- if and .Values.bluetoothCommissioning.enabled (eq .Values.bluetoothCommissioning.mode "adapter") }}
            - name: dbus
              mountPath: /run/dbus
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if and .Values.bluetoothCommissioning.enabled (eq .Values.bluetoothCommissioning.mode "adapter") }}
        - name: dbus
          hostPath:
            path: /run/dbus
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "home-assistant-matter-server.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/managed-by: {{ .Release.Service }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
