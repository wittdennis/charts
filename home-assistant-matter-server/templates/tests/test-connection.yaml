apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "home-assistant-matter-server.fullname" . }}-test-connection"
  labels:
    {{- include "home-assistant-matter-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: docker.io/library/busybox:1.38.0 # renovate: datasource=docker depName=docker.io/library/busybox versioning=docker
      command: ['wget']
      args: ['{{ include "home-assistant-matter-server.fullname" . }}:{{ .Values.service.port }}/health']
  restartPolicy: Never
