name: pull-request
permissions: {}

on:
  pull_request:
    branches:
      - main
      - release/**
    types: ["opened", "reopened", "synchronize", "edited"]

jobs:
  conventional-compliance:
    name: conventional commits
    uses: wittdennis/pipelines/.github/workflows/cog-validate.yaml@f53702a770636f128cf8cc831a681c45b0b3470d # 2.0.62
    with:
      ignore-merge-commits: true

  check-multiple:
    name: check for multiple chart changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: setup chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: v3.15.0
          yamllint_version: "1.38.0" # renovate: datasource=pypi depName=yamllint versioning=semver
          yamale_version: "6.1.0" # renovate: datasource=github-releases depName=23andMe/yamale versioning=semver
          uv_version: "0.13.0" # renovate: datasource=github-releases depName=astral-sh/uv versioning=semver

      - name: chart-testing list changed
        id: list-changed
        run: |
          changed="$(ct list-changed --config .chart-testing.yaml)"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_list=\"${changed//$'\n'/ }\"" >> "$GITHUB_OUTPUT"
          fi

      - name: check for multiple chart changes
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          COUNT=$(echo "$CHANGED_LIST" | wc -w)
          if [ "$COUNT" -gt 1 ]; then
            echo "Error: ($COUNT) charts changed. Please create separate PRs for each chart." >&2
            exit 1
          fi
        env:
          CHANGED_LIST: ${{ steps.list-changed.outputs.changed_list }}

  unittest:
    name: helm unittest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # helm 4 verifies plugin signatures by default. Git sources cannot be verified at all, and the
      # release tarballs ship detached GPG signatures rather than the provenance file helm expects.
      - name: setup helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "$UNITTEST_VERSION" --verify=false
        env:
          UNITTEST_VERSION: v1.2.1 # renovate: datasource=github-releases depName=helm-unittest/helm-unittest versioning=semver

      # Detected here rather than reused from check-multiple: ct honours .helmignore, which excludes
      # the tests directory, so a test-only change would not register as a changed chart.
      - name: determine changed charts
        id: changed
        run: |
          charts=""
          for dir in $(git diff --name-only "$BASE_SHA"...HEAD | cut -d/ -f1 | sort -u); do
            if [ -f "$dir/Chart.yaml" ]; then
              charts="$charts $dir"
            fi
          done
          echo "charts=${charts# }" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # A chart without a tests directory reports zero suites and passes.
      - name: run unit tests
        if: steps.changed.outputs.charts != ''
        run: echo "$CHARTS" | xargs helm unittest --strict
        env:
          CHARTS: ${{ steps.changed.outputs.charts }}
