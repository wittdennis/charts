name: release
permissions: {}

on:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Config and manifest are read from the target branch, so a release/** branch keeps its
          # own version line independent of main.
          target-branch: ${{ github.ref_name }}

  publish:
    name: publish ${{ matrix.chart }}
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # renovate: datasource=github-tags depName=helm/helm versioning=semver

      - name: package chart
        id: package
        run: |
          set -euo pipefail
          helm package "$CHART" -d output
          echo "file=$(ls output/*.tgz)" >> "$GITHUB_OUTPUT"
        env:
          CHART: ${{ matrix.chart }}

      - name: push chart to chartmuseum
        run: curl --fail-with-body -u "$AUTH" --data-binary "@$FILE" "$CHARTMUSEUM_URL/api/charts"
        env:
          AUTH: ${{ secrets.CHARTMUSEUM_AUTH }}
          CHARTMUSEUM_URL: ${{ vars.CHARTMUSEUM_URL }}
          FILE: ${{ steps.package.outputs.file }}

      - name: login to ghcr.io
        run: helm registry login ghcr.io --username "$USERNAME" --password-stdin <<<"$PASSWORD"
        env:
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: push chart to ghcr.io
        run: helm push "$FILE" "oci://ghcr.io/$OWNER/helm-charts"
        env:
          FILE: ${{ steps.package.outputs.file }}
          OWNER: ${{ github.repository_owner }}
