suite: filebrowser.validateValues guards
# The guards live in templates/_helpers.tpl but a define cannot be rendered on its own,
# so they are exercised through deployment.yaml, which includes them.
templates:
  - templates/deployment.yaml
tests:
  - it: renders with the default values
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  # The SQLite database on a ReadWriteOnce volume cannot take a second writer
  - it: fails when replicaCount is greater than one
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "replicaCount must be 0 or 1, got 2. filebrowser stores its users, shares and settings in a SQLite database on a single ReadWriteOnce volume; concurrent writers corrupt it."

  - it: reports the offending replicaCount in the error
    set:
      replicaCount: 5
    asserts:
      - failedTemplate:
          errorMessage: "replicaCount must be 0 or 1, got 5. filebrowser stores its users, shares and settings in a SQLite database on a single ReadWriteOnce volume; concurrent writers corrupt it."

  # Scaling to zero is a valid way to release the volume for maintenance
  - it: allows scaling down to zero
    set:
      replicaCount: 0
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.replicas
          value: 0

  - it: defaults the strategy to Recreate so the volumes are released on upgrade
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: emits rollingUpdate only for the RollingUpdate strategy
    set:
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 25%

  - it: appends additional env after the entries the chart sets
    set:
      env:
        - name: TZ
          value: Europe/Berlin
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FB_ADDRESS
              value: "0.0.0.0"
            - name: FB_PORT
              value: "8080"
            - name: TZ
              value: Europe/Berlin
