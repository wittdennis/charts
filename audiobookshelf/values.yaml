# Default values for audiobookshelf.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Replica count. Only 0 (scaled down) and 1 are valid: Audiobookshelf keeps its database in
# a SQLite file on a ReadWriteOnce volume, so a second replica would corrupt it. Anything
# higher fails the render.
replicaCount: 1

# -- Deployment strategy to use. Defaults to Recreate to avoid PVC multi-attach errors with ReadWriteOnce volumes.
deploymentStrategy:
  type: Recreate
  # rollingUpdate:
  #   maxUnavailable: 25%
  #   maxSurge: 25%

# -- Additional env values to pass to the container. Spliced in after the values below, so an
# entry here overrides one the chart derived.
env: []
# - name: HOST
#   value: 0.0.0.0

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: ghcr.io
  repository: advplyr/audiobookshelf
  # -- This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- The upstream image declares no USER and would run as root. It works fine as an arbitrary
# user instead, so file ownership is handled through fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop:
      - ALL

# -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  # -- Additional annotations for the service
  annotations: {}
  # -- Additional labels for the service
  labels: {}

# -- This block is for setting up gateway api http route. More information can be found here: https://gateway-api.sigs.k8s.io/
route:
  # -- Flag to control if route should be created
  enabled: false
  # -- Additional labels for the HTTPRoute
  labels: {}
  # -- Additional annotations for the HTTPRoute
  annotations: {}
  # -- Hostnames of the HTTPRoute
  hostnames: []
  # - audiobookshelf.example.com

  # -- Gateway reference that the HTTPRoute should bind against
  parentRefs: []
  # - group: gateway.networking.k8s.io
  #   kind: Gateway
  #   name: example-gateway
  #   namespace: gateway-namespace

  # -- Matches for the default rule
  matches:
    - path:
        type: PathPrefix
        value: /

  # -- Filter that should be added to the default rule
  filters: []

  # -- Any custom rule you want to specify.
  additionalRules: []

# -- This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Settings for storage
persistence:
  # -- Settings for the config pvc mounted at /config. Holds the SQLite database and, when the
  # binary check downloads ffmpeg, that copy too.
  config:
    # -- When false an emptyDir will be provisioned. Use this only for dev purposes
    enabled: true
    # -- Storage class to use for persistent storage. If left empty default storage class will be used.
    className: ~
    # -- Size for the persistent volume claim.
    size: 2Gi
    existingVolumeClaim: ~
    accessMode: ReadWriteOnce
  # -- Settings for the metadata pvc mounted at /metadata. Holds cache, streams, covers,
  # downloads, backups and logs, so it grows with the size of the library.
  metadata:
    # -- When false an emptyDir will be provisioned. Use this only for dev purposes
    enabled: true
    # -- Storage class to use for persistent storage. If left empty default storage class will be used.
    className: ~
    # -- Size for the persistent volume claim.
    size: 10Gi
    existingVolumeClaim: ~
    accessMode: ReadWriteOnce

# -- Volumes holding the audio files. Libraries are added in the app UI against these
# mountPaths, so the chart cannot know how many are needed. Set `existingClaim` to reuse a
# volume you already have, or leave it unset and give a `size` to have the chart provision
# one. This is a list, so overriding it replaces the default entry entirely.
# @default -- a provisioned 50Gi volume at /audiobooks
mediaMounts:
  - name: audiobooks
    mountPath: /audiobooks
    size: 50Gi
    accessMode: ReadWriteOnce
    className: ~
# Reuse an existing volume instead:
# - name: audiobooks
#   mountPath: /audiobooks
#   existingClaim: media-audiobooks
#   subPath: ""
#   readOnly: true

# -- Settings that Audiobookshelf reads from its environment. Empty values are left out so the
# application default applies.
audiobookshelf:
  # -- Time zone of the container, e.g. Europe/Berlin.
  timezone: ""
  # -- Where backups are written. Empty leaves them under the metadata volume in
  # /metadata/backups. Point this at a media mount to keep backups off that volume.
  backupPath: ""
  podcast:
    # -- Timeout in milliseconds for podcast downloads. 0 disables the timeout.
    downloadTimeout: ""
  sqlite:
    # -- cache_size pragma for the SQLite database.
    cacheSize: ""
    # -- mmap_size pragma for the SQLite database.
    mmapSize: ""
    # -- temp_store pragma for the SQLite database.
    tempStore: ""
  query:
    # -- Log SQL queries. `log` logs the queries, `benchmark` also logs their runtime.
    logging: ""
    # -- Experimental profiling of specific database queries.
    profiling: ""

# -- Audiobookshelf checks for ffmpeg and ffprobe on startup and accepts only version 5.1. The
# image ships a newer build, so on first start it downloads its own copy into the config
# volume, which needs network egress. Set `skipCheck` to use the bundled binaries as they are.
binaries:
  # -- Skip the startup binary check. Requires both paths below, because Audiobookshelf exits
  # when they are unset.
  skipCheck: false
  # -- Path to the ffmpeg binary. In the upstream image this is /usr/bin/ffmpeg.
  ffmpegPath: ""
  # -- Path to the ffprobe binary. In the upstream image this is /usr/bin/ffprobe.
  ffprobePath: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# -- This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthcheck
    port: http
readinessProbe:
  httpGet:
    path: /healthcheck
    port: http
# -- Startup probe. The failureThreshold allows five minutes, because a first start may
# download ffmpeg before the app begins listening. Set to `null` to disable; `{}` merges with
# these defaults and leaves the probe in place.
startupProbe:
  httpGet:
    path: /healthcheck
    port: http
  failureThreshold: 30
  periodSeconds: 10

# -- Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
