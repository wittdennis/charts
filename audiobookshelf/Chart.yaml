apiVersion: v2
name: audiobookshelf
description: |
  A Helm chart for Audiobookshelf.
  Audiobookshelf is a self-hosted audiobook and podcast server that syncs listening progress across clients.
  Runs rootless with a read-only root filesystem. Libraries are configured in the app UI against the paths supplied through mediaMounts.
type: application
version: 1.1.0
appVersion: "2.36.0" # renovate: datasource=docker depName=ghcr.io/advplyr/audiobookshelf versioning=docker
sources:
  - https://github.com/wittdennis/charts/tree/main/audiobookshelf
  - https://github.com/advplyr/audiobookshelf
icon: https://raw.githubusercontent.com/wittdennis/charts/refs/heads/main/audiobookshelf/assets/icon.svg
keywords:
  - audiobookshelf
  - audiobook
  - audiobooks
  - podcast
  - podcasts
  - library
annotations:
  org.opencontainers.image.source: https://github.com/wittdennis/charts
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.documentation: https://github.com/wittdennis/charts/tree/main/audiobookshelf
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: audiobookshelf
      image: ghcr.io/advplyr/audiobookshelf:2.36.0 # renovate
maintainers:
  - name: Dennis Witt
    url: https://github.com/wittdennis
