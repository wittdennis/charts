suite: media pvc provisioning
templates:
  - templates/pvc-media.yaml
tests:
  - it: provisions a claim for the default media volume
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-audiobooks
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
      # An unset className has to stay out so the cluster default storage class applies
      - notExists:
          path: spec.storageClassName

  - it: provisions nothing for an entry that names an existing claim
    set:
      mediaMounts:
        - name: audiobooks
          mountPath: /audiobooks
          existingClaim: media-audiobooks
    asserts:
      - hasDocuments:
          count: 0

  - it: provisions one claim per entry that needs one
    set:
      mediaMounts:
        - name: audiobooks
          mountPath: /audiobooks
          existingClaim: media-audiobooks
        - name: podcasts
          mountPath: /podcasts
          size: 20Gi
          className: fast
          accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-podcasts
      - equal:
          path: spec.storageClassName
          value: fast
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteMany

  - it: provisions nothing for an empty list
    set:
      mediaMounts: []
    asserts:
      - hasDocuments:
          count: 0
